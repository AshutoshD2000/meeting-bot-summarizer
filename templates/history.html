<!DOCTYPE html>
<html>
<head>
    <title>Meeting History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">MeetingBot</a>
    <div>
      <a class="btn btn-outline-light btn-sm" href="/">Create</a>
      <a class="btn btn-outline-light btn-sm" href="/history">History</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="card shadow p-4">

    <h2 class="mb-4 text-center">Meeting History</h2>

    <form method="GET" action="/history" class="row g-2 mb-4">
      <div class="col-md-6">
        <input type="text" name="search" class="form-control" placeholder="Search by title">
      </div>
      <div class="col-md-3">
        <select name="type" class="form-select">
          <option value="">All Types</option>
          <option>Team Meeting</option>
          <option>Interview</option>
          <option>Client Call</option>
          <option>Standup</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary w-100">Apply</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-hover table-bordered text-center">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Type</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for m in meetings %}
          <tr>
            <td>{{ m[0] }}</td>
            <td>
              <a href="/meeting/{{ m[0] }}" class="text-decoration-none fw-bold">
                {{ m[1] }}
              </a>
            </td>
            <td>{{ m[2] }}</td>
            <td>{{ m[3] }}</td>
            <td>
              <a href="/delete/{{ m[0] }}" 
                 class="btn btn-sm btn-danger"
                 onclick="return confirm('Are you sure?')">
                 Delete
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </div>
</div>
</body>
</html>
